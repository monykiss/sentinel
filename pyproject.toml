[project]
name = "sentinel-public-surface"
version = "1.0.0"
description = "Client SDK, MCP server and CLI for SENTINEL, an AI runtime governance control plane"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KREDO LLC" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29"]

[project.optional-dependencies]
mcp = ["mcp>=1.29,<3.0"]
cli = ["requests>=2.32,<3", "rich>=13,<16"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22,<0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
sentinel = "sentinel_cli.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/sentinel_sdk", "sentinel_mcp", "sentinel_cli"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["sdk", "."]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed dummy tokens on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
mypy_path = "sdk"
packages = ["sentinel_sdk", "sentinel_mcp", "sentinel_cli"]
ignore_missing_imports = true
check_untyped_defs = true
